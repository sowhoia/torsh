name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # A tag push publishes to PyPI, and a published version can never be
  # replaced — so the gate that gets to say "no" has to run here too, on
  # the exact tagged tree, before anything is built.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Tag matches torsh.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(python -c 'import torsh; print(torsh.__version__)')"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $tagged does not match torsh.__version__ $declared"
            exit 1
          fi

      - name: Lint
        run: python -m ruff check torsh tests

      - name: Format
        run: python -m ruff format --check torsh tests

      - name: Types
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist/wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish_pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing (OIDC) — no API token/secret required.
    # One-time setup: add a trusted publisher on PyPI for this repo,
    # workflow file "release.yml" and environment "release".
    environment:
      name: release
      url: https://pypi.org/project/torsh/
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Attach sdist/wheel to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
