[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torsh"
# Single source of truth: torsh/__init__.py. setuptools reads it statically,
# so the packaged version can never drift from the one `torsh -V` prints.
dynamic = ["version"]
description = "A self-contained BitTorrent client for your terminal: embedded engine, background daemon, scriptable CLI, beautiful TUI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "torsh authors" }]
keywords = ["bittorrent", "torrent", "libtorrent", "tui", "cli", "terminal", "textual"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
]
dependencies = [
    "libtorrent>=2.0.9",
    # Textual reworks its API across majors; pin the tested range.
    "textual>=1.0,<9",
    "rich>=13.7",
    "click>=8.1",
    "rich-click>=1.8",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/sowhoia/torsh"
Issues = "https://github.com/sowhoia/torsh/issues"

[project.scripts]
torsh = "torsh.cli:main"

[tool.setuptools.dynamic]
version = { attr = "torsh.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["torsh*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
# py.typed: torsh is fully annotated, so importers get the types too.
"torsh" = ["py.typed"]
"torsh.tui" = ["styles.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# strict-markers/strict-config: a typo'd marker or ini key fails the run
# instead of quietly doing nothing.
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["torsh"]
branch = true
# The engine's alert pump and the daemon's RPC handlers run off the main
# thread; without this their lines look untested.
concurrency = ["thread"]

[tool.coverage.report]
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]

[tool.mypy]
python_version = "3.10"
files = ["torsh"]
# libtorrent's bundled stubs describe the C++ overloads, not the friendlier
# Python bindings; textual/rich-click are only partially typed.
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.ruff]
line-length = 112
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "BLE",      # no blind `except:` without an explicit waiver
    "S",        # bandit
    "C4",       # comprehension quality
    "C90",      # keep functions under the complexity budget below
    "PERF",     # obvious performance traps
    "PIE",      # small redundancies
    "ISC",      # implicit string concatenation
    "G", "LOG", # logging done right (lazy %s formatting, no f-strings)
    "DTZ",      # no naive datetimes
    "ASYNC",    # no blocking calls hiding in coroutines
    "FLY", "RSE", "YTT", "EXE", "T10",
    "RUF",
]
ignore = [
    "S101",             # asserts guard internal invariants (and power the tests)
    "S110", "S112",     # quiet resilience loops are deliberate and commented
    "S603", "S607",     # subprocess with fixed argv is core CLI UX ($EDITOR, tail, self-exec)
    "PERF203",          # try/except inside a loop is how the alert pump stays alive
    "RUF001", "RUF002", "RUF003",  # the UI vocabulary is deliberately unicode-rich (↓ ∞ —)
    "RUF012",           # Textual's BINDINGS/COMMANDS class attributes idiom
]

[tool.ruff.lint.mccabe]
# Anything above this is a function doing several jobs; split it instead of
# raising the number.
max-complexity = 10
